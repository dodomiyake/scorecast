<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap">

<style>
/* ============================================================
   Scorecast — a dark-committed console for a football model.
   Single visual world by design: the page paints its own ground
   and every colour comes from a token, so it holds on any host.
   ============================================================ */

:root{
  /* ground: charcoal with a navy bias */
  --ink:        #090E13;
  --ink-2:      #0D141A;
  --surface:    #111A21;
  --surface-2:  #16212A;
  --surface-3:  #1C2933;
  --line:       #223039;
  --line-soft:  #1A252D;

  /* anchor: pitch green */
  --turf:       #1FA35C;
  --turf-bright:#2FCB77;
  --turf-deep:  #0E5734;
  --turf-wash:  rgba(31,163,92,.12);

  /* sharp accent: floodlight amber */
  --amber:      #F5A524;
  --amber-deep: #7A4F06;
  --amber-wash: rgba(245,165,36,.13);

  /* semantic (separate from the accent) */
  --draw:       #6E8794;
  --loss:       #DA5B52;
  --loss-wash:  rgba(218,91,82,.12);

  /* type */
  --white:      #F1F6F4;
  --text:       #DCE6E5;
  --muted:      #90A3AC;
  --faint:      #788C96;

  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --sans:    "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --r-sm: 3px;
  --r:    5px;
  --r-lg: 8px;

  --rail-w: 232px;
  --pad: clamp(16px, 3.2vw, 34px);
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -18px rgba(0,0,0,.9);
}

*,*::before,*::after{ box-sizing:border-box; }

body{
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

h1,h2,h3,h4{
  font-family:var(--display);
  font-variation-settings:"wdth" 108;
  color:var(--white);
  margin:0;
  letter-spacing:-.015em;
  text-wrap:balance;
}

a{ color:var(--turf-bright); }

button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }

:focus-visible{
  outline:2px solid var(--amber);
  outline-offset:2px;
  border-radius:2px;
}

.tnum{ font-variant-numeric:tabular-nums; }

.sr{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

.skip{
  position:absolute; left:8px; top:-60px; z-index:100;
  background:var(--turf); color:#03130A; padding:10px 16px;
  border-radius:var(--r); font-weight:600; transition:top .15s;
}
.skip:focus{ top:8px; }

/* ------------------------------------------------------------
   Shell
   ------------------------------------------------------------ */

.app{ display:flex; min-height:100vh; }

/* ---- Left rail ---- */

.rail{
  width:var(--rail-w);
  flex:0 0 var(--rail-w);
  border-right:1px solid var(--line);
  background:var(--ink-2);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
  z-index:20;
}

.brand{
  display:flex; align-items:center; gap:10px;
  padding:20px 20px 18px;
  border-bottom:1px solid var(--line-soft);
}
.brand svg{ display:block; }
.brand-name{
  font-family:var(--display);
  font-variation-settings:"wdth" 100;
  font-weight:800; font-size:19px; letter-spacing:-.02em;
  color:var(--white); line-height:1;
}
.brand-tag{
  display:block; font-family:var(--mono); font-size:9.5px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
  margin-top:4px;
}

.nav{ padding:14px 12px; display:flex; flex-direction:column; gap:2px; }
.nav-label{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint);
  padding:8px 10px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:var(--r);
  color:var(--muted); font-size:14px; font-weight:500;
  width:100%; text-align:left;
  transition:background .12s, color .12s;
  position:relative;
}
.nav-item:hover{ background:var(--surface); color:var(--text); }
.nav-item[aria-current="page"]{
  background:var(--surface-2); color:var(--white);
}
.nav-item[aria-current="page"]::before{
  content:""; position:absolute; left:-12px; top:6px; bottom:6px;
  width:2px; background:var(--turf);
}
.nav-item svg{ flex:0 0 16px; opacity:.85; }
.nav-count{
  margin-left:auto; font-family:var(--mono); font-size:11px;
  color:var(--faint);
}

.rail-foot{
  margin-top:auto; padding:14px 16px 18px;
  border-top:1px solid var(--line-soft);
  font-size:11.5px; color:var(--faint);
}
.model-row{ display:flex; align-items:center; gap:7px; margin-bottom:6px; }
.pulse{
  width:6px; height:6px; border-radius:50%; background:var(--turf-bright);
  box-shadow:0 0 0 0 rgba(47,203,119,.55);
  animation:pulse 2.6s ease-out infinite;
}
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(47,203,119,.5); }
  70%{ box-shadow:0 0 0 7px rgba(47,203,119,0); }
  100%{ box-shadow:0 0 0 0 rgba(47,203,119,0); }
}
.model-row span{ color:var(--muted); font-weight:500; }
.rail-foot .mono{ font-family:var(--mono); font-size:10.5px; letter-spacing:.02em; }

/* ---- Mobile top bar ---- */

.mobile-bar{ display:none; }

/* ---- Main ---- */

.main{ flex:1 1 auto; min-width:0; }
.wrap{ max-width:1180px; margin:0 auto; padding:0 var(--pad) 72px; }

/* ------------------------------------------------------------
   Hero — pitch geometry, not a photo
   ------------------------------------------------------------ */

.hero{
  position:relative;
  border-bottom:1px solid var(--line);
  overflow:hidden;
  background:
    radial-gradient(120% 140% at 78% -30%, rgba(31,163,92,.16) 0%, rgba(9,14,19,0) 62%),
    linear-gradient(180deg, #0B1219 0%, var(--ink) 100%);
}
.hero-art{
  position:absolute; inset:0; width:100%; height:100%;
  pointer-events:none;
}
.hero-inner{
  position:relative;
  max-width:1180px; margin:0 auto;
  padding:clamp(30px,5vw,58px) var(--pad) clamp(24px,3.4vw,34px);
}
.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--turf-bright);
  margin-bottom:16px;
}
.eyebrow .dot{ width:5px; height:5px; background:var(--turf-bright); border-radius:50%; }
.eyebrow .sep{ color:var(--faint); }
.eyebrow .grey{ color:var(--faint); }

.hero h1{
  font-size:clamp(30px,4.6vw,50px);
  font-weight:800;
  font-variation-settings:"wdth" 112;
  line-height:1.02;
  letter-spacing:-.03em;
  max-width:19ch;
}
.hero p.lede{
  margin:16px 0 0;
  max-width:56ch; font-size:15.5px; color:var(--muted); line-height:1.62;
}

.hero-stats{
  display:flex; flex-wrap:wrap; gap:0;
  margin-top:clamp(26px,3.6vw,38px);
  border-top:1px solid var(--line);
}
.hstat{
  flex:1 1 150px; min-width:140px;
  padding:16px 20px 4px 0;
  border-right:1px solid var(--line-soft);
  padding-left:20px;
}
.hstat:first-child{ padding-left:0; }
.hstat:last-child{ border-right:0; }
.hstat-k{
  font-family:var(--mono); font-size:10px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--faint); display:block; margin-bottom:8px;
}
.hstat-v{
  font-family:var(--display); font-variation-settings:"wdth" 104;
  font-weight:700; font-size:26px; color:var(--white);
  letter-spacing:-.02em; line-height:1;
  font-variant-numeric:tabular-nums;
}
.hstat-v small{ font-size:13px; font-weight:600; color:var(--muted); margin-left:3px; }
.hstat-note{ font-size:11.5px; color:var(--faint); margin-top:7px; }

/* ------------------------------------------------------------
   Section furniture
   ------------------------------------------------------------ */

.section{ margin-top:clamp(34px,4.4vw,54px); }
.section-head{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:16px; flex-wrap:wrap;
  margin-bottom:16px;
}
.section-head h2{
  font-size:clamp(18px,2vw,22px); font-weight:700;
  font-variation-settings:"wdth" 106;
  letter-spacing:-.02em;
}
.section-head .sub{ font-size:13px; color:var(--faint); margin-top:5px; }
.section-head .right{ font-size:12.5px; color:var(--faint); }

.rule{ height:1px; background:var(--line); border:0; margin:0; }

/* ------------------------------------------------------------
   Chips, pills, badges
   ------------------------------------------------------------ */

.chiprow{ display:flex; gap:7px; flex-wrap:wrap; }
.chip{
  padding:6px 12px; border:1px solid var(--line);
  border-radius:100px; font-size:12.5px; font-weight:500;
  color:var(--muted); background:var(--ink-2);
  transition:border-color .12s, color .12s, background .12s;
  white-space:nowrap;
}
.chip:hover{ color:var(--text); border-color:var(--surface-3); }
.chip[aria-pressed="true"]{
  background:var(--turf-wash); border-color:rgba(31,163,92,.45); color:var(--turf-bright);
}

.seg{
  display:inline-flex; border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; background:var(--ink-2);
}
.seg button{
  padding:6px 13px; font-size:12.5px; font-weight:500; color:var(--muted);
  border-right:1px solid var(--line);
}
.seg button:last-child{ border-right:0; }
.seg button[aria-pressed="true"]{ background:var(--surface-2); color:var(--white); }

.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; padding:3px 7px; border-radius:var(--r-sm);
  border:1px solid transparent; white-space:nowrap;
}
.badge-live{
  color:#1A1204; background:var(--amber); font-weight:600;
}
.badge-live .live-dot{
  width:5px; height:5px; border-radius:50%; background:#1A1204;
  animation:blink 1.6s steps(1,end) infinite;
}
@keyframes blink{ 0%,60%{opacity:1} 61%,100%{opacity:.25} }
.badge-ft{ color:var(--faint); border-color:var(--line); }
.badge-soon{ color:var(--amber); background:var(--amber-wash); border-color:rgba(245,165,36,.28); }

/* ------------------------------------------------------------
   Signature: the probability rail
   Three segments — home / draw / away — at three scales.
   ------------------------------------------------------------ */

.prail{
  display:flex; width:100%; height:4px; border-radius:2px;
  overflow:hidden; background:var(--surface-3);
}
.prail span{ display:block; height:100%; }
.prail .s-home{ background:var(--turf); }
.prail .s-draw{ background:var(--draw); }
.prail .s-away{ background:var(--amber); }

.prail-md{ height:8px; border-radius:2px; }
.prail-lg{ height:34px; border-radius:var(--r-sm); }
.prail-lg span{
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:12px; font-weight:600;
  color:#04120A;
}
.prail-lg .s-draw{ color:#0A1216; }
.prail-lg .s-away{ color:#1A1204; }

.prail-key{
  display:flex; gap:18px; flex-wrap:wrap;
  margin-top:10px; font-size:11.5px; color:var(--muted);
}
.prail-key i{
  display:inline-block; width:8px; height:8px; border-radius:2px;
  margin-right:6px; vertical-align:middle;
}

/* ------------------------------------------------------------
   Crests (monogram placeholders)
   ------------------------------------------------------------ */

.crest{
  width:26px; height:26px; flex:0 0 26px;
  border-radius:var(--r-sm);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--display); font-variation-settings:"wdth" 92;
  font-weight:800; font-size:10px; letter-spacing:.01em;
  color:var(--white); border:1px solid rgba(255,255,255,.1);
  background:var(--surface-3);
  user-select:none;
}
.crest-lg{ width:44px; height:44px; flex-basis:44px; font-size:15px; border-radius:var(--r); }

/* ------------------------------------------------------------
   Top picks
   ------------------------------------------------------------ */

.picks{
  display:grid; gap:12px;
  grid-template-columns:repeat(auto-fit,minmax(272px,1fr));
}
.pick{
  text-align:left; width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:16px 16px 14px;
  display:flex; flex-direction:column; gap:13px;
  transition:border-color .14s, background .14s, transform .14s;
}
.pick:hover{ border-color:#2C3D48; background:var(--surface-2); }
.pick:active{ transform:translateY(1px); }
.pick-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.pick-league{
  font-family:var(--mono); font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint);
}
.pick-teams{ display:flex; flex-direction:column; gap:9px; }
.pick-team{ display:flex; align-items:center; gap:10px; }
.pick-team .nm{
  font-family:var(--display); font-variation-settings:"wdth" 100;
  font-weight:600; font-size:15px; color:var(--white);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.pick-team .sc{
  margin-left:auto; font-family:var(--mono); font-weight:600;
  font-size:17px; color:var(--white); font-variant-numeric:tabular-nums;
}
.pick-team.dim .nm,.pick-team.dim .sc{ color:var(--muted); }
.pick-foot{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; padding-top:12px; border-top:1px solid var(--line-soft);
}
.pick-verdict{ font-size:12.5px; color:var(--muted); }
.pick-verdict b{ color:var(--text); font-weight:600; }

/* confidence meter — small */
.conf{
  display:flex; align-items:center; gap:8px;
  font-family:var(--mono); font-size:11px; color:var(--muted);
  white-space:nowrap;
}
.conf-bar{
  width:46px; height:4px; border-radius:2px; background:var(--surface-3);
  overflow:hidden; flex:0 0 46px;
}
.conf-bar i{ display:block; height:100%; background:var(--amber); }
.conf-hi i{ background:var(--turf-bright); }
.conf-lo i{ background:var(--draw); }
.conf-val{ color:var(--white); font-weight:600; }

/* ------------------------------------------------------------
   Fixture list
   ------------------------------------------------------------ */

.league-block{ margin-top:26px; }
.league-head{
  display:flex; align-items:center; gap:11px;
  padding:0 12px 8px;
  border-bottom:1px solid var(--line);
}
.league-flag{
  width:20px; height:14px; flex:0 0 20px; border-radius:2px;
  border:1px solid rgba(255,255,255,.12); overflow:hidden;
}
.league-head h3{
  font-size:14px; font-weight:700; letter-spacing:-.005em;
  font-variation-settings:"wdth" 104;
}
.league-head .cnt{
  margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint);
}

.fx-head{
  display:grid; align-items:center;
  grid-template-columns:60px minmax(0,1fr) 76px 154px 96px;
  gap:16px; padding:14px 12px 9px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--faint); white-space:nowrap;
  border-bottom:1px solid var(--line);
}
.fx-head span{ overflow:hidden; text-overflow:ellipsis; }
.fx-head-fixture{ display:flex; justify-content:space-between; gap:12px; }
.fx{
  display:grid; align-items:center; width:100%; text-align:left;
  grid-template-columns:60px minmax(0,1fr) 76px 154px 96px;
  gap:16px; padding:11px 12px;
  border-bottom:1px solid var(--line-soft);
  transition:background .12s;
  position:relative;
}
.fx:hover{ background:var(--surface); }
.fx:hover .fx-teams .nm{ color:var(--turf-bright); }
.fx-time{
  font-family:var(--mono); font-size:12.5px; color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.fx-teams{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.fx-markets{
  font-family:var(--mono); font-size:10.5px; color:var(--faint);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;
}
.fx-markets b{ color:var(--muted); font-weight:600; }
.fx-team{ display:flex; align-items:center; gap:9px; min-width:0; }
.fx-team .nm{
  font-family:var(--display); font-variation-settings:"wdth" 100;
  font-weight:600; font-size:14.5px; color:var(--white);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:color .12s;
}
.fx-team .fx-form{ margin-left:auto; padding:0 8px 0 14px; }
.fx-team .actual{
  margin-left:auto; font-family:var(--mono); font-size:13px;
  color:var(--amber); font-weight:600; padding-left:8px;
}
.fx-pred{
  font-family:var(--mono); font-size:17px; font-weight:600; color:var(--white);
  font-variant-numeric:tabular-nums; letter-spacing:.02em;
}
.fx-pred small{
  display:none; font-family:var(--sans); font-size:10.5px;
  color:var(--faint); font-weight:400; letter-spacing:0; margin-top:2px;
}
.fx-prob{ display:flex; flex-direction:column; gap:6px; }
.fx-prob .nums{
  display:flex; justify-content:space-between;
  font-family:var(--mono); font-size:10.5px; color:var(--faint);
  font-variant-numeric:tabular-nums;
}
.fx-prob .nums b{ color:var(--text); font-weight:500; }
.fx-conf{ display:flex; justify-content:flex-end; }

/* ------------------------------------------------------------
   Match detail
   ------------------------------------------------------------ */

.back{
  display:inline-flex; align-items:center; gap:7px;
  font-size:13px; color:var(--muted); padding:6px 0; margin-top:18px;
}
.back:hover{ color:var(--turf-bright); }

.md-head{
  display:flex; align-items:center; gap:clamp(16px,4vw,44px);
  flex-wrap:wrap;
  padding:clamp(20px,3vw,30px) 0;
}
.md-side{ display:flex; align-items:center; gap:13px; min-width:0; flex:1 1 200px; }
.md-side.away{ flex-direction:row-reverse; text-align:right; }
.md-side .nm{
  font-family:var(--display); font-variation-settings:"wdth" 106;
  font-weight:700; font-size:clamp(19px,2.4vw,25px); color:var(--white);
  letter-spacing:-.02em; line-height:1.1;
}
.md-side .meta{ font-size:11.5px; color:var(--faint); margin-top:4px; font-family:var(--mono); }
.md-score{
  text-align:center; flex:0 0 auto;
}
.md-score .k{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--faint); display:block; margin-bottom:8px;
}
.md-score .v{
  font-family:var(--display); font-variation-settings:"wdth" 100;
  font-weight:800; font-size:clamp(38px,6vw,54px); color:var(--white);
  line-height:.95; letter-spacing:-.03em; font-variant-numeric:tabular-nums;
}
.md-score .kick{ font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:10px; }

.grid-2{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
.grid-3{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(232px,1fr)); }

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:18px;
}
.card-k{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-bottom:14px;
}
.card p{ margin:0; font-size:13.5px; color:var(--muted); line-height:1.62; max-width:72ch; }
.card p + p{ margin-top:10px; }

/* confidence dial — drawn from the centre circle */
.dial-wrap{ display:flex; align-items:center; gap:18px; }
.dial{ flex:0 0 96px; }
.dial-txt .n{
  font-family:var(--display); font-variation-settings:"wdth" 100;
  font-weight:800; font-size:32px; color:var(--white); line-height:1;
  font-variant-numeric:tabular-nums;
}
.dial-txt .n span{ font-size:15px; color:var(--muted); }
.dial-txt .lab{
  font-size:13px; color:var(--text); margin-top:7px; font-weight:600;
}
.dial-txt .sub{ font-size:12px; color:var(--faint); margin-top:4px; line-height:1.5; }

/* signals */
.sig{ display:flex; flex-direction:column; }
.sig-row{
  display:grid; grid-template-columns:1fr auto 1fr;
  align-items:center; gap:12px;
  padding:11px 0; border-bottom:1px solid var(--line-soft);
}
.sig-row:last-child{ border-bottom:0; }
.sig-row .lab{
  font-family:var(--mono); font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--faint); text-align:center;
  white-space:nowrap;
}
.sig-row .h{ text-align:left; }
.sig-row .a{ text-align:right; }
.sig-val{
  font-family:var(--mono); font-size:14px; color:var(--text);
  font-variant-numeric:tabular-nums; font-weight:500;
}
.sig-val.strong{ color:var(--white); }
.sig-bar{
  height:3px; margin-top:6px; background:var(--surface-3); border-radius:2px; overflow:hidden;
  display:flex;
}
.sig-bar i{ display:block; height:100%; background:var(--turf); }
.sig-bar.right{ justify-content:flex-end; }
.sig-bar.right i{ background:var(--amber); }

/* form pips */
.form{ display:inline-flex; gap:3px; }
.pip{
  width:19px; height:19px; border-radius:var(--r-sm);
  display:inline-flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:10px; font-weight:600;
  color:#050B08; background:var(--turf);
}
.pip.d{ background:var(--draw); color:#081115; }
.pip.l{ background:var(--loss); color:#180605; }
.pip.sm{
  width:17px; height:17px; font-size:9px; font-weight:500;
  background:rgba(31,163,92,.20); color:#63D69A;
}
.pip.sm.d{ background:var(--surface-3); color:var(--muted); }
.pip.sm.l{ background:rgba(218,91,82,.17); color:#E28B84; }

/* h2h list */
.h2h{ display:flex; flex-direction:column; }
.h2h-row{
  display:grid; grid-template-columns:74px 1fr auto;
  gap:12px; align-items:center;
  padding:9px 0; border-bottom:1px solid var(--line-soft);
  font-size:13px;
}
.h2h-row:last-child{ border-bottom:0; }
.h2h-row .dt{ font-family:var(--mono); font-size:11px; color:var(--faint); white-space:nowrap; }
.h2h-row .tm{ color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.h2h-row .sc{
  font-family:var(--mono); font-weight:600; color:var(--white);
  font-variant-numeric:tabular-nums;
}

/* absences */
.abs{ display:flex; flex-direction:column; gap:9px; }
.abs-row{ display:flex; gap:10px; align-items:baseline; font-size:13px; }
.abs-row .who{ color:var(--text); font-weight:500; }
.abs-row .why{ color:var(--faint); font-size:12px; margin-left:auto; white-space:nowrap; }
.abs-none{ font-size:13px; color:var(--faint); }

/* reasoning */
.why-list{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:12px; }
.why-list li{
  display:flex; gap:12px; font-size:13.5px; color:var(--muted); line-height:1.6;
}
.why-list .mk{
  flex:0 0 auto; margin-top:6px; width:16px; height:1px; background:var(--turf);
}
.why-list b{ color:var(--text); font-weight:600; }

/* ------------------------------------------------------------
   Accuracy / charts
   ------------------------------------------------------------ */

.kpis{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }
.kpi{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:17px 18px;
}
.kpi-k{
  font-family:var(--mono); font-size:10px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--faint); margin-bottom:11px;
}
.kpi-v{
  font-family:var(--display); font-variation-settings:"wdth" 102;
  font-weight:800; font-size:34px; color:var(--white); line-height:1;
  letter-spacing:-.025em; font-variant-numeric:tabular-nums;
}
.kpi-v span{ font-size:17px; color:var(--muted); margin-left:2px; }
.kpi-note{ font-size:11.5px; color:var(--faint); margin-top:9px; line-height:1.5; }
.delta{ font-family:var(--mono); font-size:11.5px; font-weight:500; }
.delta.up{ color:var(--turf-bright); }
.delta.dn{ color:var(--loss); }
.delta.flat{ color:var(--faint); }

.chart-card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:18px 18px 12px;
}
.chart-scroll{ overflow-x:auto; }
.chart-legend{
  display:flex; gap:18px; flex-wrap:wrap;
  font-size:11.5px; color:var(--muted); margin-top:12px;
}
.chart-legend i{
  display:inline-block; width:14px; height:2px; margin-right:7px; vertical-align:middle;
}

/* league accuracy rows */
.acc{ display:flex; flex-direction:column; }
.acc-row{
  display:grid; grid-template-columns:150px 1fr 62px 62px 64px;
  gap:14px; align-items:center;
  padding:12px 0; border-bottom:1px solid var(--line-soft);
}
.acc-row:last-child{ border-bottom:0; }
.acc-row.head{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--faint); padding:0 0 9px;
  border-bottom:1px solid var(--line);
}
.acc-name{ display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--text); }
.acc-bar{ height:6px; background:var(--surface-3); border-radius:3px; overflow:hidden; position:relative; }
.acc-bar i{ display:block; height:100%; background:var(--turf); }
.acc-bar .base{
  position:absolute; top:-4px; bottom:-4px; width:2px;
  background:var(--white); opacity:.55; border-radius:1px;
}
.acc-num{
  font-family:var(--mono); font-size:13px; text-align:right;
  font-variant-numeric:tabular-nums; color:var(--white); font-weight:500;
}
.acc-num.dim{ color:var(--muted); font-weight:400; }

/* ------------------------------------------------------------
   Leaderboard
   ------------------------------------------------------------ */

.lb{ display:flex; flex-direction:column; }
.lb-row{
  display:grid; grid-template-columns:30px 1fr 90px 1fr 74px 68px;
  gap:14px; align-items:center;
  padding:13px 0; border-bottom:1px solid var(--line-soft);
}
.lb-row:last-child{ border-bottom:0; }
.lb-row.head{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--faint); padding:0 0 9px;
  border-bottom:1px solid var(--line);
}
.lb-rank{
  font-family:var(--display); font-variation-settings:"wdth" 92;
  font-weight:800; font-size:15px; color:var(--faint);
  font-variant-numeric:tabular-nums;
}
.lb-row:nth-child(2) .lb-rank{ color:var(--amber); }
.lb-name{ font-size:14px; color:var(--white); font-weight:500; }
.lb-name small{ display:block; font-size:11.5px; color:var(--faint); font-weight:400; margin-top:3px; }
.lb-scope{ font-family:var(--mono); font-size:11.5px; color:var(--muted); }

/* ------------------------------------------------------------
   League tables
   ------------------------------------------------------------ */

.table-scroll{ overflow-x:auto; }
table.lt{
  width:100%; border-collapse:collapse; min-width:640px;
  font-variant-numeric:tabular-nums;
}
table.lt th{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint); font-weight:400;
  text-align:right; padding:0 8px 10px; border-bottom:1px solid var(--line);
  white-space:nowrap;
}
table.lt th:nth-child(1){ text-align:left; width:34px; }
table.lt th:nth-child(2){ text-align:left; width:100%; }
table.lt th:last-child{ text-align:left; }
table.lt td{
  padding:10px 8px; border-bottom:1px solid var(--line-soft);
  font-family:var(--mono); font-size:13px; text-align:right; color:var(--muted);
}
table.lt td:nth-child(1){ text-align:left; color:var(--faint); }
table.lt td:nth-child(2){ text-align:left; }
table.lt td:last-child{ text-align:left; }
table.lt tbody tr:hover td{ background:var(--surface); }
.lt-team{ display:flex; align-items:center; gap:9px; }
.lt-team .nm{
  font-family:var(--display); font-variation-settings:"wdth" 100;
  font-weight:600; font-size:13.5px; color:var(--white);
  white-space:nowrap;
}
table.lt td.pts{ color:var(--white); font-weight:600; }
tr.zone-ucl td:nth-child(1){ box-shadow:inset 2px 0 0 var(--turf); }
tr.zone-rel td:nth-child(1){ box-shadow:inset 2px 0 0 var(--loss); }
.zone-key{ display:flex; gap:18px; font-size:11.5px; color:var(--faint); margin-top:12px; flex-wrap:wrap; }
.zone-key i{ display:inline-block; width:2px; height:11px; margin-right:7px; vertical-align:-1px; }

/* recent results */
.res{ display:flex; flex-direction:column; }
.res-row{
  display:grid; grid-template-columns:52px 1fr auto 1fr;
  gap:12px; align-items:center; padding:9px 0;
  border-bottom:1px solid var(--line-soft); font-size:13px;
}
.res-row:last-child{ border-bottom:0; }
.res-row .dt{ font-family:var(--mono); font-size:11px; color:var(--faint); }
.res-row .hm{ color:var(--text); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.res-row .aw{ color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.res-row .sc{
  font-family:var(--mono); font-weight:600; color:var(--white);
  background:var(--surface-2); padding:2px 8px; border-radius:var(--r-sm);
  font-variant-numeric:tabular-nums; font-size:12.5px;
}
.res-row .hit{ box-shadow:inset 0 0 0 1px rgba(31,163,92,.5); }
.res-row .miss{ box-shadow:inset 0 0 0 1px rgba(218,91,82,.4); }

/* ------------------------------------------------------------
   Method page
   ------------------------------------------------------------ */

.prose{ max-width:66ch; }
.prose h3{
  font-size:16px; font-weight:700; margin:0 0 10px;
  font-variation-settings:"wdth" 104;
}
.prose p{ font-size:14.5px; color:var(--muted); line-height:1.68; margin:0 0 14px; }
.prose p b{ color:var(--text); font-weight:600; }

.steps{ display:flex; flex-direction:column; gap:0; }
.step{
  display:grid; grid-template-columns:104px 1fr; gap:22px;
  padding:20px 0; border-bottom:1px solid var(--line-soft);
}
.step:last-child{ border-bottom:0; }
.step-k{
  font-family:var(--mono); font-size:10px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--turf-bright);
  padding-top:2px;
}
.step h4{ font-size:15px; font-weight:700; margin:0 0 7px; font-variation-settings:"wdth" 104; }
.step p{ margin:0; font-size:13.5px; color:var(--muted); line-height:1.65; max-width:74ch; }
.step ul{ margin:9px 0 0; padding-left:17px; font-size:13.5px; color:var(--muted);
  line-height:1.7; max-width:74ch; }
.step ul li::marker{ color:var(--faint); }

.conf-scale{ display:flex; flex-direction:column; gap:0; }
.conf-scale-row{
  display:grid; grid-template-columns:96px 1fr; gap:16px; align-items:start;
  padding:13px 0; border-bottom:1px solid var(--line-soft);
}
.conf-scale-row:last-child{ border-bottom:0; }
.conf-scale-row .rng{
  font-family:var(--mono); font-size:12.5px; color:var(--white);
  display:flex; align-items:center; gap:8px;
}
.conf-scale-row .rng i{ width:8px; height:8px; border-radius:2px; }
.conf-scale-row .desc{ font-size:13px; color:var(--muted); line-height:1.6; }

/* ------------------------------------------------------------
   States: loading / empty
   ------------------------------------------------------------ */

.skel{
  background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 48%,var(--surface) 100%);
  background-size:220% 100%;
  animation:shimmer 1.5s linear infinite;
  border-radius:var(--r-sm);
}
@keyframes shimmer{ from{ background-position:120% 0 } to{ background-position:-120% 0 } }
.skel-row{
  display:grid; grid-template-columns:56px minmax(0,1fr) 74px 116px 96px;
  gap:14px; align-items:center; padding:15px 12px;
  border-bottom:1px solid var(--line-soft);
}
.skel-line{ height:10px; }
.skel-stack{ display:flex; flex-direction:column; gap:8px; }

.empty{
  border:1px dashed var(--line);
  border-radius:var(--r-lg);
  padding:clamp(34px,6vw,58px) 26px;
  text-align:center;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 44px, transparent 44px 88px),
    var(--ink-2);
}
.empty svg{ margin:0 auto 18px; display:block; }
.empty h3{ font-size:17px; margin-bottom:9px; font-variation-settings:"wdth" 104; }
.empty p{ margin:0 auto; max-width:44ch; font-size:13.5px; color:var(--muted); line-height:1.62; }
.empty .actions{ margin-top:20px; display:flex; gap:9px; justify-content:center; flex-wrap:wrap; }

.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:9px 16px; border-radius:var(--r);
  font-size:13.5px; font-weight:600;
  background:var(--turf); color:#03130A;
  transition:background .13s;
}
.btn:hover{ background:var(--turf-bright); }
.btn-ghost{
  background:transparent; color:var(--text); border:1px solid var(--line);
}
.btn-ghost:hover{ background:var(--surface-2); border-color:var(--surface-3); }

/* ------------------------------------------------------------
   Disclaimer + footer
   ------------------------------------------------------------ */

.disclaim{
  margin-top:clamp(34px,4.4vw,52px);
  border-top:1px solid var(--line);
  padding-top:20px;
  display:flex; gap:14px; align-items:flex-start;
}
.disclaim svg{ flex:0 0 16px; margin-top:2px; opacity:.6; }
.disclaim p{
  margin:0; font-size:12.5px; color:var(--faint); line-height:1.65; max-width:74ch;
}
.disclaim p + p{ margin-top:8px; }
.disclaim b{ color:var(--muted); font-weight:600; }

.foot{
  margin-top:26px; padding-top:18px; border-top:1px solid var(--line-soft);
  display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em;
  color:var(--faint); text-transform:uppercase;
}

/* ------------------------------------------------------------
   Responsive
   ------------------------------------------------------------ */


/* ------------------------------------------------------------
   Tips — market calls ranked against the book
   ------------------------------------------------------------ */

.tip{
  display:grid; align-items:center; width:100%; text-align:left;
  grid-template-columns:34px minmax(0,1fr) 150px 92px 108px 78px;
  gap:16px; padding:13px 12px;
  border-bottom:1px solid var(--line-soft);
  transition:background .12s;
}
.tip:hover{ background:var(--surface); }
.tip:hover .tip-fx b{ color:var(--turf-bright); }
.tip-head{
  display:grid; grid-template-columns:34px minmax(0,1fr) 150px 92px 108px 78px;
  gap:16px; padding:14px 12px 9px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--faint); white-space:nowrap;
  border-bottom:1px solid var(--line);
}
.tip-rank{
  font-family:var(--display); font-variation-settings:"wdth" 92;
  font-weight:800; font-size:15px; color:var(--faint);
  font-variant-numeric:tabular-nums;
}
.tip-fx{ min-width:0; }
.tip-fx b{
  display:block; font-family:var(--display); font-variation-settings:"wdth" 100;
  font-weight:600; font-size:14.5px; color:var(--white);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:color .12s;
}
.tip-fx span{
  display:block; font-family:var(--mono); font-size:10.5px;
  color:var(--faint); margin-top:4px;
}
.tip-sel{
  font-size:13.5px; color:var(--text); font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tip-sel small{
  display:block; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--faint); font-weight:400; margin-top:4px;
}
.tip-num{
  font-family:var(--mono); font-size:14px; color:var(--white); font-weight:500;
  font-variant-numeric:tabular-nums; text-align:right;
}
.tip-num small{
  display:block; font-size:10.5px; color:var(--faint); font-weight:400; margin-top:4px;
}
.tip-vs{ display:flex; flex-direction:column; gap:5px; }
.tip-vs .bar{
  height:5px; border-radius:3px; background:var(--surface-3);
  position:relative; overflow:hidden;
}
.tip-vs .bar i{ display:block; height:100%; background:var(--turf); }
.tip-vs .bar .mk{
  position:absolute; top:-3px; bottom:-3px; width:2px;
  background:var(--white); opacity:.6; border-radius:1px;
}
.tip-vs .lab{
  font-family:var(--mono); font-size:10px; color:var(--faint);
  display:flex; justify-content:space-between;
}
.tip-edge{
  font-family:var(--mono); font-size:14px; font-weight:600;
  text-align:right; font-variant-numeric:tabular-nums; color:var(--turf-bright);
}
.tip-edge small{
  display:block; font-size:10px; color:var(--faint); font-weight:400;
  letter-spacing:.08em; text-transform:uppercase; margin-top:4px;
}

/* ------------------------------------------------------------
   Market board on the match card
   ------------------------------------------------------------ */

.mkt{ display:flex; flex-direction:column; }
.mkt-group{ padding:12px 0; border-bottom:1px solid var(--line-soft); }
.mkt-group:last-child{ border-bottom:0; }
.mkt-title{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint); margin-bottom:10px;
}
.mkt-best{
  display:inline-flex; align-items:center; gap:5px;
  font-family:var(--mono); font-size:10px; letter-spacing:.04em;
  text-transform:none; padding:2px 8px; border-radius:100px;
  color:var(--turf-bright); border:1px solid rgba(31,163,92,.32);
  background:var(--turf-wash); white-space:nowrap;
}
.mkt-row{
  display:grid; grid-template-columns:minmax(0,1fr) 58px 1fr 58px;
  gap:12px; align-items:center; padding:5px 0;
}
.mkt-row .nm{ font-size:13px; color:var(--text); }
.mkt-row .pc{
  font-family:var(--mono); font-size:13px; color:var(--white); font-weight:500;
  text-align:right; font-variant-numeric:tabular-nums;
}
.mkt-row .bk{
  font-family:var(--mono); font-size:12px; color:var(--faint);
  text-align:right; font-variant-numeric:tabular-nums;
}
.mkt-bar{ height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; position:relative; }
.mkt-bar i{ display:block; height:100%; background:var(--turf); }
.mkt-bar .mk{
  position:absolute; top:-3px; bottom:-3px; width:2px;
  background:var(--white); opacity:.55; border-radius:1px;
}

/* score distribution */
.sgrid{ display:flex; flex-direction:column; gap:7px; }
.sgrid-row{ display:grid; grid-template-columns:52px 1fr 52px; gap:12px; align-items:center; }
.sgrid-row .sc{
  font-family:var(--mono); font-size:13.5px; color:var(--white); font-weight:600;
  font-variant-numeric:tabular-nums;
}
.sgrid-row .pc{
  font-family:var(--mono); font-size:12px; color:var(--muted); text-align:right;
  font-variant-numeric:tabular-nums;
}
.sgrid-bar{ height:9px; border-radius:2px; background:var(--surface-3); overflow:hidden; }
.sgrid-bar i{ display:block; height:100%; background:var(--turf); }
.sgrid-row:first-child .sgrid-bar i{ background:var(--turf-bright); }

/* provenance / data-quality flags */
.flag{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; padding:3px 8px; border-radius:100px;
  border:1px solid var(--line); color:var(--faint); white-space:nowrap;
}
.flag-thin{ color:var(--amber); border-color:rgba(245,165,36,.32); background:var(--amber-wash); }
.flag-ok{ color:var(--turf-bright); border-color:rgba(31,163,92,.32); background:var(--turf-wash); }

.note{
  border:1px solid var(--line); border-left:2px solid var(--amber);
  border-radius:var(--r); background:var(--ink-2);
  padding:14px 16px; font-size:13px; color:var(--muted); line-height:1.62;
}
.note b{ color:var(--text); font-weight:600; }
.note + .note{ margin-top:10px; }

/* strength table */
.str-row{
  display:grid; grid-template-columns:28px minmax(0,1fr) 1fr 1fr 56px;
  gap:14px; align-items:center; padding:10px 0;
  border-bottom:1px solid var(--line-soft);
}
.str-row:last-child{ border-bottom:0; }
.str-row.head{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint); padding:0 0 9px;
  border-bottom:1px solid var(--line);
}
.str-name{ display:flex; align-items:center; gap:9px; min-width:0; }
.str-name .nm{
  font-family:var(--display); font-variation-settings:"wdth" 100;
  font-weight:600; font-size:13.5px; color:var(--white);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.dumb{ position:relative; height:6px; background:var(--surface-3); border-radius:3px; }
.dumb .zero{ position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:var(--faint); }
.dumb i{ position:absolute; top:0; bottom:0; border-radius:3px; }
.dumb i.pos{ background:var(--turf); }
.dumb i.neg{ background:var(--loss); }

@media (max-width:900px){
  .tip-head{ display:none; }
  .tip{
    grid-template-columns:26px minmax(0,1fr) auto;
    grid-template-areas:
      "rank fx  model"
      "rank sel gap";
    gap:6px 12px; align-items:start;
  }

function confChip(c){
  var b = confBand(c);
  return '<span class="conf '+b.cls+'"><span class="conf-bar"><i style="width:'+c+'%"></i></span>'+
         '<span class="conf-val tnum">'+c+'</span></span>';
}

/* The signature: one three-segment rail at three scales. */
function prail(p, size){
  var cls = size === "lg" ? "prail prail-lg" : size === "md" ? "prail prail-md" : "prail";
  var inner = size === "lg";
  var v = p.map(function(x){ return pc(x); });
  return '<div class="'+cls+'" role="img" aria-label="Home win '+v[0]+' percent, draw '+v[1]+
    ' percent, away win '+v[2]+' percent">'+
    '<span class="s-home" style="width:'+(p[0]*100)+'%">'+(inner?v[0]+"%":"")+'</span>'+
    '<span class="s-draw" style="width:'+(p[1]*100)+'%">'+(inner?v[1]+"%":"")+'</span>'+
    '<span class="s-away" style="width:'+(p[2]*100)+'%">'+(inner?v[2]+"%":"")+'</span></div>';
}

function dial(conf){
  var b = confBand(conf), col = confColor(conf);
  var r = 40, c = 2 * Math.PI * r, on = c * (conf/100);
  return '<svg class="dial" width="96" height="96" viewBox="0 0 96 96" role="img" '+
    'aria-label="Confidence '+conf+' out of 100, '+b.label.toLowerCase()+'">'+
    '<circle cx="48" cy="48" r="'+r+'" fill="none" stroke="#1C2933" stroke-width="7"/>'+
    '<circle cx="48" cy="48" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="7" '+
      'stroke-dasharray="'+on.toFixed(1)+' '+(c-on).toFixed(1)+'" transform="rotate(-90 48 48)"/>'+
    '<circle cx="48" cy="48" r="23" fill="none" stroke="#2FCB77" stroke-opacity=".2"/>'+
    '<path d="M48 21v54" stroke="#2FCB77" stroke-opacity=".15"/>'+
    '<circle cx="48" cy="48" r="2" fill="'+col+'"/></svg>';

/* Pitch geometry in false perspective — lines only, no photograph. */
function heroArt(){
  var stripes = "";

  return '<svg class="hero-art" viewBox="0 0 1400 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+

      '<path d="M1440 168 H1178 L1120 412 H1440"/><path d="M1440 224 H1288 L1258 356 H1440"/>'+

function emptyPitch(){

    '<rect x=".6" y=".6" width="84.8" height="54.8" rx="2" stroke="#223039"/>'+

    '<path d="M1 16h13v24H1M85 16H72v24h13" stroke="#223039"/></svg>';

function infoIcon(){
  return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">'+

    '<path d="M8 7.2v4M8 4.7v.9" stroke="#788C96" stroke-width="1.4" stroke-linecap="round"/></svg>';

/* ============================================================
   Dates
   ============================================================ */

var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DAY = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function parseISO(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmtShort(s){ var d = parseISO(s); return d.getDate()+" "+MON[d.getMonth()]; }
function fmtLong(s){ var d = parseISO(s); return DAY[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear(); }

/* Dates present on the card, in order, labelled relative to build day. */
var DATES = (function(){
  var seen = {}, out = [];
  P.card.forEach(function(f){ if (!seen[f.date]){ seen[f.date] = 1; out.push(f.date); } });
  out.sort();
  return out.map(function(d, i){
    return { date:d, key:d, label: i === 0 ? "Today" : (i === 1 ? "Tomorrow" : fmtShort(d)),
             list: P.card.filter(function(f){ return f.date === d; }) };
  });
})();

/* ============================================================
   Market vocabulary — one place, so a selection is named the
   same way in the tips list, the match card and the record.
   ============================================================ */

var MARKETS = {
  home:    { label:"Home win",        group:"Match outcome" },
  draw:    { label:"Draw",            group:"Match outcome" },
  away:    { label:"Away win",        group:"Match outcome" },
  o15:     { label:"Over 1.5 goals",  group:"Total goals" },
  u15:     { label:"Under 1.5 goals", group:"Total goals" },
  o25:     { label:"Over 2.5 goals",  group:"Total goals" },
  u25:     { label:"Under 2.5 goals", group:"Total goals" },
  o35:     { label:"Over 3.5 goals",  group:"Total goals" },
  u35:     { label:"Under 3.5 goals", group:"Total goals" },
  btts:    { label:"Both teams score",     group:"Both teams to score" },
  nobtts:  { label:"Not both teams score", group:"Both teams to score" },
  dc_1x:   { label:"Home or draw",    group:"Double chance" },
  dc_12:   { label:"Home or away",    group:"Double chance" },
  dc_x2:   { label:"Draw or away",    group:"Double chance" },
  cs_home: { label:"Home clean sheet", group:"Clean sheet" },
  cs_away: { label:"Away clean sheet", group:"Clean sheet" },
  margin_1:  { label:"Winning margin 1",  group:"Winning margin" },
  margin_2p: { label:"Winning margin 2+", group:"Winning margin" }
};

function selLabel(f, key){
  var m = MARKETS[key];
  if (!m) return key;
  if (key === "home") return f.homeShort + " win";
  if (key === "away") return f.awayShort + " win";
  if (key === "dc_1x") return f.homeShort + " or draw";
  if (key === "dc_x2") return "Draw or " + f.awayShort;
  if (key === "dc_12") return f.homeShort + " or " + f.awayShort;
  if (key === "cs_home") return f.homeShort + " clean sheet";
  if (key === "cs_away") return f.awayShort + " clean sheet";
  return m.label;
}

function prob(f, key){
  if (key === "home") return f.probs[0];
  if (key === "draw") return f.probs[1];
  if (key === "away") return f.probs[2];
  return f.mk[key];
}

/* Book probability for the selections we actually hold odds on. */
function bookProb(f, key){
  var b = f.book;
  if (!b) return null;
  if (b.probs){
    if (key === "home") return b.probs[0];
    if (key === "draw") return b.probs[1];
    if (key === "away") return b.probs[2];
  }
  if (b.ou){
    if (key === "o25") return b.ou[0];
    if (key === "u25") return b.ou[1];
  }
  return null;
}
function bookOdds(f, key){
  var o = f.odds || {};
  return { home:o.h, draw:o.d, away:o.a, o25:o.o25, u25:o.u25 }[key];
}

/* Every selection the model has an opinion on, with its edge over the
   book where a price exists. This is what the Tips view ranks. */
function selections(f){
  var keys = ["home","draw","away","o25","u25","o15","u15","o35","u35",
              "btts","nobtts","dc_1x","dc_12","dc_x2","cs_home","cs_away",
              "margin_1","margin_2p"];
  return keys.map(function(k){
    var mp = prob(f, k), bp = bookProb(f, k);
    return {
      fx:f, key:k, label:selLabel(f, k), group:MARKETS[k].group,
      model:mp, book:bp, odds:bookOdds(f, k),
      edge: bp == null ? null : mp - bp
    };
  });
}

function priced(f){
  return selections(f).filter(function(s){ return s.edge != null; });
}

/* The single most likely selection in each market group (excluding match
   outcome, which is already shown on its own everywhere) — "the highest
   possible outcome of each market", read straight off the same selections
   the market board and the tips page already use. o15/u35 are excluded:
   they're near-certainties by construction and would win "Total goals"
   every time without saying anything a reader doesn't already know. */
function bestPerGroup(f){
  var out = {};
  selections(f).forEach(function(s){
    if (s.group === "Match outcome" || s.key === "o15" || s.key === "u35") return;
    if (!out[s.group] || s.model > out[s.group].model) out[s.group] = s;
  });
  return out;
}

function disclaimer(){
  return '<section class="disclaim">'+infoIcon()+
    '<div><p><b>These are probabilities, not forecasts of certainty.</b> Over the settled matches on '+
    'the record page the model called the right result '+P.backtest.overall.outcome.rate.toFixed(1)+
    '% of the time. Roughly half its calls were wrong.</p>'+
    '<p>Scorecast publishes model output for information and analysis. It is not betting advice, it '+
    'makes no claim about returns, and a positive gap against a bookmaker\'s price is a disagreement '+
    'between two estimates — not a profit. Gambling carries real financial risk. 18+.</p></div></section>';
}

function footer(){
  return '<footer class="foot"><span>Scorecast &middot; Dixon-Coles model, built '+
    esc(fmtShort(P.built))+' 2026</span>'+
    '<span>'+P.backtest.n+' out-of-sample matches scored &middot; 18+</span></footer>';
}

window.__U = {
  esc:esc, pc:pc, odds:odds, crest:crest, flag:flag, prail:prail, dial:dial,
  confChip:confChip, confBand:confBand, confColor:confColor,
  heroArt:heroArt, emptyPitch:emptyPitch, infoIcon:infoIcon,
  fmtShort:fmtShort, fmtLong:fmtLong, parseISO:parseISO,
  DATES:DATES, MARKETS:MARKETS, selLabel:selLabel, prob:prob,
  bookProb:bookProb, bookOdds:bookOdds, selections:selections, priced:priced,
  bestPerGroup:bestPerGroup, disclaimer:disclaimer, footer:footer
};
})();
</script>

<script>
(function(){
"use strict";
var P = window.__P, U = window.__U, L = window.__LEAGUES;
if (!P || !U || !L) return;

function localISO(d){
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

var now = new Date();
var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
var tomorrow = new Date(today);
tomorrow.setDate(tomorrow.getDate() + 1);
var todayKey = localISO(today);
var tomorrowKey = localISO(tomorrow);

var seen = {};
var keys = [];
function add(key){
  if (!seen[key]){ seen[key] = true; keys.push(key); }
}

// Always expose the user's real local Today and Tomorrow, even if there are
// zero covered fixtures. Then append every future date present in the card.
add(todayKey);
add(tomorrowKey);
P.card.forEach(function(f){
  if (f.date >= todayKey) add(f.date);
});
keys.sort();

U.DATES = keys.map(function(d){
  var label = d === todayKey ? "Today" : (d === tomorrowKey ? "Tomorrow" : U.fmtShort(d));
  return {
    date: d,
    key: d,
    label: label,
    list: P.card.filter(function(f){ return f.date === d; })
  };
});

// The legacy empty-state renderer expects L[state.league] to exist. Give the
// synthetic "all" filter a non-enumerable label so Object.keys(L) still only
// contains real leagues.
if (!Object.prototype.hasOwnProperty.call(L, "all")){
  Object.defineProperty(L, "all", {
    value: {name: "covered", country: ""},
    enumerable: false,
    configurable: true
  });
}
})();
</script>

<script>
(function(){
"use strict";
var P = window.__P, L = window.__LEAGUES, U = window.__U;
var esc = U.esc, pc = U.pc;

function fileToDiv(f){
  for (var k in L) if (L[k].file === f) return k;
  return null;
}
/* Long dataset names -> the label people use, from the curated map the model
   already keeps. Regex-stripping suffixes turns Feyenoord Rotterdam into
   something no supporter says, so don't. */
function tidy(n){
  return (P.names && P.names[n]) ? P.names[n]
       : n.replace(/ (FC|AFC|CF|SC|BC|SV)$/, "").replace(/^(FC|AFC|SV|SC|RC|AS|AJ|US|AC|SS|CA|RCD|CD) /, "");
}
function card(id){
  return P.card.filter(function(f){ return f.id === id; })[0] || null;
}

/* Fixtures with both sides genuinely fitted — the only ones the model
   has real evidence for. Everything else is flagged in the interface. */
function solid(list){ return list.filter(function(f){ return f.thin === 0; }); }

function flagFor(f){
  if (f.thin === 0) return "";
  return '<span class="flag flag-thin">'+(f.thin === 2 ? "limited data" : "carried across tier")+'</span>';
}

/* ============================================================
   Fixture row and pick card
   ============================================================ */

function teamLine(f, which){
  var name = which === "h" ? f.home : f.away;
  var g = which === "h" ? f.pred[0] : f.pred[1];
  return '<span class="fx-team">'+U.crest(name)+
    '<span class="nm">'+esc(name)+'</span></span>';
}

var SHORT_MKT = {
  o15:"O1.5", u15:"U1.5", o25:"O2.5", u25:"U2.5", o35:"O3.5", u35:"U3.5",
  btts:"BTTS Y", nobtts:"BTTS N"
};

/* The top pick from Total goals and Both teams to score, compact enough
   for a fixture row: "O2.5 55% · BTTS Y 58%". Match outcome is already
   the row's headline, so it isn't repeated here. */
function marketsLine(f){
  var best = U.bestPerGroup(f);
  var picks = [best["Total goals"], best["Both teams to score"]].filter(Boolean);
  if (!picks.length) return "";
  return picks.map(function(s){
    return (SHORT_MKT[s.key] || s.label)+' <b>'+pc(s.model)+'%</b>';
  }).join(" &middot; ");
}

function fixtureRow(f){
  var ml = marketsLine(f);
  return '<button class="fx" data-match="'+esc(f.id)+'" aria-label="'+
      esc(f.home+" versus "+f.away+", model predicts "+f.pred[0]+"–"+f.pred[1])+'">'+
    '<span><span class="fx-time">'+esc(f.time)+'</span></span>'+
    '<span class="fx-teams">'+teamLine(f,"h")+teamLine(f,"a")+
      (ml ? '<span class="fx-markets">'+ml+'</span>' : "")+'</span>'+
    '<span class="fx-pred tnum">'+f.pred[0]+'&ndash;'+f.pred[1]+'<small>predicted</small></span>'+
    '<span class="fx-prob">'+U.prail(f.probs)+
      '<span class="nums tnum"><span><b>'+pc(f.probs[0])+'</b>%</span>'+
      '<span><b>'+pc(f.probs[1])+'</b>%</span><span><b>'+pc(f.probs[2])+'</b>%</span></span></span>'+
    '<span class="fx-conf">'+U.confChip(f.conf)+'</span>'+
  '</button>';
}

function pickCard(f){
  var b = U.confBand(f.conf);
  var i = f.probs.indexOf(Math.max.apply(null, f.probs));
  var verdict = i === 1 ? "Draw" : (i === 0 ? f.homeShort : f.awayShort) + " to win";
  // the most likely SCORE and the most likely OUTCOME need not agree: 1-1 can
  // be the single commonest scoreline while a home win is the likelier result
  var predOutcome = f.pred[0] > f.pred[1] ? 0 : (f.pred[0] < f.pred[1] ? 2 : 1);
  var split = predOutcome !== i;
  return '<button class="pick" data-match="'+esc(f.id)+'">'+
    '<span class="pick-top">'+
      '<span class="pick-league">'+esc(L[f.div].name)+'</span>'+
      '<span class="badge badge-soon">'+esc(f.time)+'</span>'+
    '</span>'+
    '<span class="pick-teams">'+
      '<span class="pick-team'+(f.pred[0]>=f.pred[1]?"":" dim")+'">'+U.crest(f.home)+
        '<span class="nm">'+esc(f.home)+'</span><span class="sc tnum">'+f.pred[0]+'</span></span>'+
      '<span class="pick-team'+(f.pred[1]>f.pred[0]?"":" dim")+'">'+U.crest(f.away)+
        '<span class="nm">'+esc(f.away)+'</span><span class="sc tnum">'+f.pred[1]+'</span></span>'+
    '</span>'+
    U.prail(f.probs, "md")+
    '<span class="pick-foot">'+
      '<span class="pick-verdict"><b>'+esc(verdict)+'</b> &middot; '+pc(Math.max.apply(null,f.probs))+'%'+
      (split ? '<br><span style="color:var(--faint);font-size:11.5px">likeliest score '+
        f.pred[0]+'&ndash;'+f.pred[1]+'</span>' : "")+'</span>'+
      U.confChip(f.conf)+
    '</span>'+
  '</button>';
}

/* ============================================================
   Today
   ============================================================ */

function viewToday(state){
  var day = U.DATES.filter(function(d){ return d.key === state.day; })[0] || U.DATES[0];
  var all = day.list;

  var picks = solid(all).slice().sort(function(a,b){ return b.conf - a.conf; }).slice(0,3);
  var value = [];
  solid(all).forEach(function(f){ value = value.concat(U.priced(f)); });
  value.sort(function(a,b){ return b.edge - a.edge; });
  value = value.filter(function(s){ return s.model >= 0.35; }).slice(0,3);

  var bt = P.backtest;
  var best = picks[0];

  h += '<header class="hero">'+U.heroArt()+'<div class="hero-inner">'+

    '<h1>'+(best
      ? esc(best.homeShort+' '+best.pred[0]+'–'+best.pred[1]+' '+best.awayShort)+
        ' is the model&rsquo;s firmest call today.'
      : 'No fixtures priced for this date.')+'</h1>'+
    '<p class="lede">Every fixture below is priced by a Dixon-Coles model fitted on '+
      Object.keys(P.meta.train).reduce(function(a,k){ return a + P.meta.train[k].n; }, 0).toLocaleString()+
      ' real 2025/26 results and the '+
      Object.keys(P.season.played).reduce(function(a,k){ return a + P.season.played[k]; }, 0)+
      ' played so far in 2026/27. Predicted scoreline, outcome probabilities and a confidence rating '+
      'for each, plus the gap against the bookmakers&rsquo; own price.</p>'+
    '<div class="hero-stats">'+
      '<div class="hstat"><span class="hstat-k">Fixtures priced</span>'+
        '<div class="hstat-v tnum">'+all.length+'</div>'+
        '<div class="hstat-note">across '+Object.keys(all.reduce(function(a,f){ a[f.div]=1; return a; },{})).length+' leagues</div></div>'+
      '<div class="hstat"><span class="hstat-k">Correct outcomes</span>'+
        '<div class="hstat-v tnum">'+bt.overall.outcome.rate.toFixed(1)+'<small>%</small></div>'+
        '<div class="hstat-note">out of sample, '+bt.n+' matches</div></div>'+
      '<div class="hstat"><span class="hstat-k">Above baseline</span>'+
        '<div class="hstat-v tnum">+'+(bt.overall.outcome.rate - bt.home_baseline).toFixed(1)+'<small>pts</small></div>'+
        '<div class="hstat-note">vs always calling the home side</div></div>'+
      '<div class="hstat"><span class="hstat-k">Called right this season</span>'+
        '<div class="hstat-v tnum">'+(P.graded.length
          ? P.graded.filter(function(g){ return g.hit; }).length+'<small>/'+P.graded.length+'</small>'
          : '&mdash;')+'</div>'+
        '<div class="hstat-note">'+(P.graded.length

    '</div></div></header>';

  h += '<div class="wrap">';

  h += '<section class="section" style="margin-top:26px"><div class="section-head">'+
    '<div><div class="seg" role="group" aria-label="Match date">'+
      U.DATES.map(function(d){
        return '<button data-day="'+esc(d.key)+'" aria-pressed="'+(d.key===state.day)+'">'+
               esc(d.label)+'</button>';
      }).join("")+
    '</div></div>'+
    '<div class="chiprow" role="group" aria-label="Filter by league">'+
      '<button class="chip" data-league="all" aria-pressed="'+(state.league==="all")+'">All leagues</button>'+
      Object.keys(L).map(function(k){
        var n = all.filter(function(f){ return f.div === k; }).length;
        if (!n) return "";
        return '<button class="chip" data-league="'+k+'" aria-pressed="'+(state.league===k)+'">'+
               esc(L[k].name)+' <span class="tnum" style="opacity:.6">'+n+'</span></button>';
      }).join("")+
    '</div></div></section>';

  h += gradedStrip();

  if (picks.length){
    h += '<section class="section" style="margin-top:22px">'+
      '<div class="section-head"><div><h2>Today&rsquo;s strongest calls</h2>'+
      '<div class="sub">Highest confidence on the card, restricted to fixtures where both sides have '+
      'at least 20 matches behind them in the fit.</div></div></div>'+
      '<div class="picks">'+picks.map(pickCard).join("")+'</div></section>';
  }

  if (value.length){
    h += '<section class="section"><div class="section-head">'+
      '<div><h2>Furthest from the bookmakers</h2>'+
      '<div class="sub">Where the model and the market disagree most. A gap is a disagreement between '+
      'two estimates, not a profit.</div></div>'+
