name: CI

on:
  push:
    branches: ["fix/**"]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python3 -m py_compile model/refresh.py model/finalize_payload.py model/site.py
      - name: Regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install pinned model dependencies
        run: pip install -r requirements.txt
      - name: Full refresh smoke test
        run: python3 model/refresh.py
