name: Daily data refresh

# Re-fetches fixtures, odds, and every league's current-season results,
# rebuilds index.html + data/payload.json, commits, and deploys straight to
# Vercel with the CLI using a token (see the Deploy step below) rather than
# relying on Vercel's GitHub App to notice the push. That App connection
# broke silently twice in two days with no error surfaced anywhere -- this
# sidesteps it rather than trusting it again.
#
# Runs on GitHub's infrastructure, not the maintainer's machine, so it fires
# on schedule regardless of whether anything local is open.

on:
  schedule:
    # GitHub's schedule trigger is documented as unreliable right at the top
    # of the hour (congestion) and can simply not fire at all on quiet/new
    # repos with no clear error surfaced. :17 avoids the congestion point;
    # a local Claude scheduled task also fires this workflow directly via
    # `gh workflow run` as a backup trigger, since GitHub's own schedule
    # event went a full day without firing once on this repo.
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}    # allows a manual "Run workflow" from the Actions tab, or the backup trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install numpy scipy scikit-learn

      - run: python3 model/refresh.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed — no commit."
          else
            git commit -m "Daily data refresh: $(date -u +%Y-%m-%d)"
            git push
          fi

      # Deploys directly via the Vercel CLI + API token, independent of
      # whether Vercel's GitHub App can currently see this repo. This is
      # the step that actually gets today's data live -- the git push
      # above is for history/traceability, not what drives the deploy.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_LsaGL88Nyd7xBPiX7Do9WynW
          VERCEL_PROJECT_ID: prj_lJnYu5YHChd1vNFdX4kHyfdWQXPj
        run: npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
