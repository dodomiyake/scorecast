name: Daily data refresh

# Uses football-data.co.uk when it is healthy (including bookmaker odds), with
# OpenFootball as a fresh schedule/results fallback. Rebuilds index.html +
# data/payload.json, commits, and deploys straight to Vercel with the CLI.

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scorecast-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned model dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Refresh data and rebuild site
        run: python3 model/production_refresh.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed — no commit."
          else
            git commit -m "Daily data refresh: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_LsaGL88Nyd7xBPiX7Do9WynW
          VERCEL_PROJECT_ID: prj_lJnYu5YHChd1vNFdX4kHyfdWQXPj
        run: npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
