name: Daily data refresh

# Re-fetches fixtures, odds, and every league's current-season results, then
# rebuilds and commits index.html + data/payload.json. Pushing to master is
# what actually matters here: Vercel is linked to this repo and redeploys on
# every push, so this is the step that gets fresh matches onto the live site.
#
# Runs on GitHub's infrastructure, not the maintainer's machine, so it fires
# on schedule regardless of whether anything local is open.

on:
  schedule:
    # GitHub's schedule trigger is documented as unreliable right at the top
    # of the hour (congestion) and can simply not fire at all on quiet/new
    # repos with no clear error surfaced. :17 avoids the congestion point;
    # a local Claude scheduled task also fires this workflow directly via
    # `gh workflow run` as a backup trigger, since GitHub's own schedule
    # event went a full day without firing once on this repo.
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}    # allows a manual "Run workflow" from the Actions tab, or the backup trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install numpy scipy scikit-learn

      - run: python3 model/refresh.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed — no commit."
          else
            git commit -m "Daily data refresh: $(date -u +%Y-%m-%d)"
            git push
          fi
